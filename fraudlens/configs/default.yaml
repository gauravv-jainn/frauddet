# FraudLens configuration. All money values are in the dataset's currency (shown as EUR in the app).
seed: 42
data:
  cache_dir: null          # folder with fraudTrain.csv/fraudTest.csv; null = download via kagglehub
  validation_fraction: 0.15 # last 15% of the training period (by time) is validation
features:
  merchant_encoding: target # target-encode merchant on the training split only (smoothed)
  te_smoothing: 50
model:
  optuna_trials: 30
  cv_folds: 3
  tuning_sample_negatives: 0.25 # fraction of genuine rows kept inside Optuna CV (all frauds kept) for speed
costs:
  review_cost: 5.0          # cost of an analyst reviewing one flagged transaction
bands:                      # calibrated probability lower bounds
  medium: null              # null = the money-optimal decision threshold, so "flagged" == Medium or above
  high: 0.30
  critical: 0.70
explain:
  top_raising: 4
  top_lowering: 2
app:
  db: data/fraudlens.sqlite   # users, API keys, cases, audit trail (env FRAUDLENS_DB overrides)
  session_timeout_minutes: 60
  max_failed_logins: 5       # then the account is locked for lockout_minutes
  lockout_minutes: 15
  max_upload_rows: 20000
api:
  max_batch: 1000            # transactions per POST /v1/score
  rate_limit_per_minute: 120 # per API key
