[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#0F172A"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#16213A"
textColor = "#E2E8F0"

[server]
headless = true
address = "localhost"
maxUploadSize = 50          # MB; batch files are capped by rows in configs/default.yaml too
enableXsrfProtection = true
runOnSave = false

[browser]
gatherUsageStats = false
