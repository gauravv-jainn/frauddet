name: fraudlens-ci

on:
  push:
    paths: ["fraudlens/**", ".github/workflows/fraudlens-ci.yml"]
  pull_request:
    paths: ["fraudlens/**", ".github/workflows/fraudlens-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraudlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraudlens/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-api.txt ruff==0.17.1
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        # Tests that need the Kaggle data or a trained model skip themselves in CI.
        run: pytest -q
